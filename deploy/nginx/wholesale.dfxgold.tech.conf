# /etc/nginx/sites-available/wholesale.dfxgold.tech  (enable with a symlink in sites-enabled)
#
# DFX Wholesale - a separate app on the same VPS. This file only ADDS a new
# server_name; it does not touch the DFX sites. Every name in it (upstreams,
# rate-limit zone) is prefixed "wholesale_" so nothing clashes with dfx.conf.
#
# The app runs under rootless Docker (user sufiyan) and listens on 127.0.0.1 only:
#   API 127.0.0.1:8020   web 127.0.0.1:3020
#
# Steps (after DNS for wholesale.dfxgold.tech points at 200.97.161.119):
#   sudo cp wholesale.dfxgold.tech.conf /etc/nginx/sites-available/wholesale.dfxgold.tech
#   sudo ln -s /etc/nginx/sites-available/wholesale.dfxgold.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wholesale.dfxgold.tech
# certbot then adds the 443 server block and the HTTP -> HTTPS redirect itself.

upstream wholesale_api {
    server 127.0.0.1:8020;
    keepalive 32;
}
upstream wholesale_web {
    server 127.0.0.1:3020;
    keepalive 32;
}

# The app has no lockout after wrong passwords yet, so nginx limits sign-in
# attempts per client IP ($binary_remote_addr can't be forged by a header).
limit_req_zone $binary_remote_addr zone=wholesale_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wholesale.dfxgold.tech;

    server_tokens off;

    # Piece / combo photos and the logo are up to 5 MB each.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_hide_header X-Powered-By;

    # API docs are not published on the internet.
    location = /docs         { return 404; }
    location = /redoc        { return 404; }
    location = /openapi.json { return 404; }

    # Sign-in and first-time setup: throttled harder than the rest of the API.
    location ~ ^/api/v1/auth/(login|setup)$ {
        limit_req zone=wholesale_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://wholesale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://wholesale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                          # bill PDFs, bulk entry
    }

    # Photos and the logo, served by the API from its uploads volume. File
    # names are random per upload and never reused, so they cache well.
    location /uploads/ {
        proxy_pass http://wholesale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://wholesale_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
